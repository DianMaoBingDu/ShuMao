<form id="myForm" action="/ocr-upload" enctype="multipart/form-data" method="post">
    <label class="custom-uploader" for="file">Select File</label>
    <input id="file" accept="image/jpeg,image/gif,image/png,application/pdf,image/x-eps" name="file" type="file" />
    <br><button class="btn btn-success" name="submit" type="submit">
        Upload File
    </button>
</form>
<p>{{ text }}</p>
